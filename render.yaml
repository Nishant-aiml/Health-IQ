# Render Blueprint Specification for Health-IQ
# Automatically provisions:
# 1. PostgreSQL Database (health-iq-db)
# 2. FastAPI Backend API (health-iq-backend)
# 3. React Vite Frontend (health-iq-frontend)

databases:
  - name: health-iq-db
    databaseName: health_iq
    user: health_iq_user
    plan: free
    region: oregon

services:
  # Backend Web Service (FastAPI)
  - type: web
    name: health-iq-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: health-iq-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: SARVAM_API_KEY
        sync: false
      - key: GLM_API_KEY
        sync: false

  # Frontend Web App (React Vite SPA)
  - type: web
    name: health-iq-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
